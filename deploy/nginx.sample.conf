# Sample nginx site for Svaram, as svaram.live runs it. Replace svaram.live with your domain.
# Install to /etc/nginx/sites-available/ and link it from sites-enabled/.
#
# Privacy: no request bodies or query strings in logs,
# truncated IPs, bodies never spill to temp files, no proxy temp files.

# ---- http-level settings (this file is included inside nginx's http block) ----
map $remote_addr $svaram_ip_anon {
    ~(?P<a>\d+\.\d+\.\d+)\.\d+$          $a.0;
    ~^(?P<b>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):  $b::;
    default                              0.0.0.0;
}
log_format svaram_privacy '$svaram_ip_anon [$time_iso8601] "$request_method $uri" '
                          '$status $body_bytes_sent $request_time';

# ---- bot and flood protection ----
# Limits are per address and generous: many Indian mobile users share one public address.
# The server's own checks (127.0.0.1, ::1) are exempt: an empty key is never limited.
geo $svaram_outside { default 1; 127.0.0.1/32 0; ::1/128 0; }
map $svaram_outside $svaram_key { 0 ""; default $binary_remote_addr; }
limit_req_zone  $svaram_key zone=svaram_tr:4m     rate=20r/m;     # translate: /api/convey, /api/prepare
limit_req_zone  $svaram_key zone=svaram_speak:4m  rate=90r/m;     # speak: one call per piece of a message
limit_req_zone  $svaram_key zone=svaram_static:4m rate=20r/s;     # pages, phrases, fonts
limit_conn_zone $svaram_key zone=svaram_conn:4m;
# Only svaram.live's own pages may call the API (browsers always send Origin on POST); local checks exempt.
map "$svaram_outside:$http_origin" $svaram_origin_ok { "~^0:" 1; "1:https://svaram.live" 1; default 0; }

server {
    listen 80;
    listen [::]:80;
    server_name svaram.live;
    access_log /var/log/nginx/svaram.access.log svaram_privacy;
    error_log  /var/log/nginx/svaram.error.log warn;

    location ^~ /.well-known/acme-challenge/ { root /var/www/svaram; }
    location / { return 301 https://svaram.live$uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name svaram.live;

    ssl_certificate     /etc/letsencrypt/live/svaram.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/svaram.live/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:svaram_ssl:2m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/svaram.access.log svaram_privacy;
    error_log  /var/log/nginx/svaram.error.log warn;

    root /var/www/svaram;
    index index.html;
    server_tokens off;
    client_max_body_size 8k;
    client_body_buffer_size 16k;

    # slow or many connections from one address
    limit_conn svaram_conn 20;
    limit_conn_status 429;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 15s;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ^~ /.well-known/acme-challenge/ { root /var/www/svaram; }

    # ---- beta public API (svaram-api on 127.0.0.1:8200): POST only,
    # rate-limited, bodies in memory only (8k limit above), never cached. ----
    location ~ ^/api/(prepare|convey)$ {
        limit_except POST { deny all; }
        if ($svaram_origin_ok = 0) { return 403; }
        limit_req zone=svaram_tr burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @svaram_wait;
        include /etc/nginx/svaram/api-proxy.conf;    # see deploy/nginx.api-proxy.conf
    }
    location = /api/speak {
        limit_except POST { deny all; }
        if ($svaram_origin_ok = 0) { return 403; }
        limit_req zone=svaram_speak burst=40 nodelay;
        limit_req_status 429;
        error_page 429 = @svaram_wait;
        include /etc/nginx/svaram/api-proxy.conf;    # see deploy/nginx.api-proxy.conf
    }
    # Over the limit: a short JSON answer with the wait, which the page turns into a countdown.
    location @svaram_wait {
        default_type application/json;
        add_header Retry-After 15 always;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        return 429 '{"error":{"code":"RATE_LIMITED","retry_after_ms":15000}}';
    }
    location = /api/health {
        proxy_pass http://127.0.0.1:8200/api/health;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }
    location /api/ { return 404; }   # plain prefix (no ^~) so the regex above still wins

    location / {
        limit_req zone=svaram_static burst=100 nodelay;
        limit_req_status 429;
        try_files $uri $uri/ =404;
    }
}
