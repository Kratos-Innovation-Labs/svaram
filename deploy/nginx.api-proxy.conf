# Included by the /api/ locations in nginx.sample.conf. Install to /etc/nginx/svaram/api-proxy.conf.
# Request and response bodies stay in memory: never in temporary files, never cached.
proxy_pass http://127.0.0.1:8200;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_request_buffering on;
proxy_buffering on;
proxy_buffers 32 16k;
proxy_max_temp_file_size 0;
proxy_read_timeout 30s;
proxy_hide_header Cache-Control;
add_header Cache-Control "no-store" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
# CORS (design D22): only the origins given a value in $svaram_cors (nginx.sample.conf) get these
# headers; for everyone else the values are empty and nginx sends nothing. The browser's preflight
# (OPTIONS) is answered here, after the origin check in the location and before any rate limit.
add_header Access-Control-Allow-Origin $svaram_cors always;
add_header Access-Control-Allow-Methods $svaram_cors_methods always;
add_header Access-Control-Allow-Headers $svaram_cors_headers always;
add_header Access-Control-Max-Age $svaram_cors_max_age always;
add_header Vary Origin always;
if ($request_method = OPTIONS) { return 204; }
